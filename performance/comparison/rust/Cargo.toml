[package]
name = "liquid-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
liquid = "=0.26.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "=1.4.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
