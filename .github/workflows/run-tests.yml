name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  REQUIRED_PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.5', '8.4', '8.3', '8.2']
        stability: [prefer-lowest, prefer-stable]

    name: Test on P${{ matrix.php }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.REQUIRED_PHP_EXTENSIONS }}
          ini-values: opcache.jit=disable
          coverage: none

      - name: "Cache composer dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: php-${{ matrix.php }}-composer-${{ matrix.os }}-${{ matrix.stability }}

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest

      - name: Verify restricted execution with hot JIT traces
        if: matrix.stability == 'prefer-stable'
        run: >-
          php -d opcache.enable_cli=1 -d opcache.jit_buffer_size=128M
          -d opcache.jit=tracing -d opcache.jit_hot_func=1 -d opcache.jit_hot_loop=1
          vendor/bin/pest tests/Integration/UntrustedTemplatesTest.php
          tests/Integration/CompilationProfileTest.php
          tests/Integration/StableStreamingTest.php tests/Integration/TemplateSnapshotTest.php
          tests/Integration/IsolatedRendererTest.php
